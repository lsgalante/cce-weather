[package]
name = "cce-weather"
version = "0.1.0"
edition = "2021"

[dependencies]
cce-ui = { git = "https://github.com/lsgalante/cce-ui.git", rev = "df44b179a60961ead00152deb883d34fbe30b411" }
calloop = "0.13.0"
wayland-client = { version = "0.31", features = ["system"] }
# Open-Meteo (forecast + geocoding): keyless HTTPS JSON.
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
kdl = "4.6"
log = "0.4"
env_logger = "0.11"
